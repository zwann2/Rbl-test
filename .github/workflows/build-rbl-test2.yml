name: Build RBL TEST2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier le ZIP source
        run: |
          test -f Redacted_BannerLab_Source.zip || {
            echo "ERREUR: Redacted_BannerLab_Source.zip introuvable à la racine du dépôt."
            exit 1
          }
          unzip -t Redacted_BannerLab_Source.zip

      - name: Extraire les sources
        run: |
          rm -rf app app.extract
          mkdir -p app.extract
          unzip -q Redacted_BannerLab_Source.zip -d app.extract

          if [ -f app.extract/package.json ]; then
            mv app.extract app
          else
            mapfile -t PKGS < <(find app.extract -mindepth 2 -maxdepth 3 -type f -name package.json -print)
            [ "${#PKGS[@]}" -eq 1 ] || { echo "ERREUR: package.json absent ou ambigu."; exit 1; }
            ROOT="$(dirname "${PKGS[0]}")"
            mkdir app
            cp -a "$ROOT"/. app/
            rm -rf app.extract
          fi

          test -f app/package.json

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Installer les dépendances
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Compiler le web
        working-directory: app
        run: npm run build

      - name: Générer Android
        working-directory: app
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Copier les ressources Android
        working-directory: app
        run: |
          test -d android-res || { echo "ERREUR: android-res absent."; exit 1; }
          cp -a android-res/. android/app/src/main/res/

      - name: Appliquer le patch RBL
        working-directory: app
        env:
          RBL_GITHUB_REPOSITORY: ${{ github.repository }}
          RBL_TEST_BUILD: "1"
        run: |
          python3 android-patch/patch_manifest.py

      - name: Transformer en application TEST2 indépendante
        working-directory: app
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle')
          txt = gradle.read_text(encoding='utf-8')
          txt, n = re.subn(
              r'(?m)^(\s*)applicationId\s+["\'][^"\']+["\']\s*$',
              r'\1applicationId "com.bannerforge.mobile.test2"',
              txt,
              count=1
          )
          if n != 1:
              raise SystemExit('Impossible de forcer applicationId TEST2')
          gradle.write_text(txt, encoding='utf-8')

          # Nom visible distinct pour pouvoir garder PROD/TEST/TEST2 côte à côte.
          strings = Path('android/app/src/main/res/values/strings.xml')
          if strings.exists():
              s = strings.read_text(encoding='utf-8')
              s = re.sub(r'<string name="app_name">.*?</string>',
                         '<string name="app_name">Redacted BannerLab TEST2</string>', s, count=1)
              s = re.sub(r'<string name="title_activity_main">.*?</string>',
                         '<string name="title_activity_main">Redacted BannerLab TEST2</string>', s, count=1)
              strings.write_text(s, encoding='utf-8')
          PY2

          grep -q 'applicationId "com.bannerforge.mobile.test2"' android/app/build.gradle || {
            echo "ERREUR: package TEST2 absent."
            exit 1
          }

      - name: Lire la version
        working-directory: app
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "RBL_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version: $VERSION"

      - name: Créer la clé TEST2 locale du workflow
        working-directory: app
        run: |
          mkdir -p signing
          printf '%s' '' | base64 --decode > signing/rbl-test2.jks
          chmod 600 signing/rbl-test2.jks
          keytool -list -keystore signing/rbl-test2.jks -storepass rbltest2 -alias rbltest2 >/dev/null
          echo "Clé TEST2 OK (clé volontairement non secrète, réservée à TEST2)."

      - name: Compiler RELEASE non signé
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease

      - name: Aligner et signer TEST2
        working-directory: app
        run: |
          UNSIGNED=$(find android/app/build/outputs/apk/release -type f -name '*unsigned*.apk' | head -n 1)
          test -n "$UNSIGNED" || { echo "ERREUR: APK non signé introuvable."; exit 1; }

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          mkdir -p output
          ALIGNED="output/Redacted-BannerLab-TEST2-${RBL_VERSION}-aligned.apk"
          SIGNED="output/Redacted-BannerLab-TEST2-v${RBL_VERSION}.apk"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$ALIGNED"

          "$APKSIGNER" sign \
            --ks signing/rbl-test2.jks \
            --ks-key-alias rbltest2 \
            --ks-pass pass:rbltest2 \
            --key-pass pass:rbltest2 \
            --out "$SIGNED" \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs "$SIGNED"
          rm -f "$ALIGNED"
          echo "APK_PATH=$SIGNED" >> "$GITHUB_ENV"

      - name: Vérifier le package final
        working-directory: app
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/aapt" dump badging "$APK_PATH" | head -n 8
          "$BUILD_TOOLS/aapt" dump badging "$APK_PATH" | grep -q "package: name='com.bannerforge.mobile.test2'" || {
            echo "ERREUR: l'APK final n'est pas TEST2."
            exit 1
          }

      - name: Publier / remplacer la Release TEST2
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Une seule release roulante. Pas d'Actions artifact => pas de quota artifacts qui se remplit.
          gh release delete test2-latest --cleanup-tag -y 2>/dev/null || true

          gh release create test2-latest "$APK_PATH" \
            --title "Redacted BannerLab TEST2 · $RBL_VERSION" \
            --notes "Build TEST2 automatique · package com.bannerforge.mobile.test2 · run #${{ github.run_number }}" \
            --prerelease

          echo "Release TEST2 publiée."
          
